name: "Historia de Usuario"
description: "Crear una Historia de Usuario para SignIA"
title: "[HU] "
labels:
  - "Historia de Usuario"

body:
  - type: markdown
    attributes:
      value: |
        ## Historia de Usuario

        Complete la siguiente información de forma clara y concreta.

  - type: input
    id: como
    attributes:
      label: "Como"
      description: "Indique el tipo de usuario o actor."
      placeholder: "Ejemplo: usuario registrado"
    validations:
      required: true

  - type: textarea
    id: quiero
    attributes:
      label: "Quiero"
      description: "Describa la funcionalidad o necesidad."
      placeholder: "Ejemplo: iniciar sesión utilizando mi correo y contraseña"
    validations:
      required: true

  - type: textarea
    id: para
    attributes:
      label: "Para"
      description: "Explique el beneficio o propósito de la funcionalidad."
      placeholder: "Ejemplo: acceder a las funciones asociadas a mi cuenta"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Criterios de Aceptación

        Escriba condiciones claras que permitan comprobar cuándo la Historia de Usuario funciona correctamente.

  - type: textarea
    id: criterios
    attributes:
      label: "Criterios de Aceptación"
      description: "Escriba cada criterio utilizando una casilla."
      value: |
        - [ ] 
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## INVEST

        Verifique que la Historia de Usuario cumpla los criterios INVEST antes de incorporarla a un Sprint.

  - type: checkboxes
    id: invest
    attributes:
      label: "Validación INVEST"
      options:
        - label: "I - Independent: puede desarrollarse sin depender completamente de otra historia."
        - label: "N - Negotiable: sus detalles pueden discutirse y ajustarse con el equipo."
        - label: "V - Valuable: entrega valor al usuario o al funcionamiento del sistema."
        - label: "E - Estimable: el equipo puede estimar el esfuerzo necesario."
        - label: "S - Small: puede completarse dentro de un Sprint."
        - label: "T - Testable: puede comprobarse mediante criterios de aceptación."

  - type: markdown
    attributes:
      value: |
        ## Definition of Done - DoD

        La Historia de Usuario podrá considerarse terminada cuando se cumplan los siguientes puntos.

  - type: checkboxes
    id: dod
    attributes:
      label: "Definition of Done"
      options:
        - label: "Se cumplieron los criterios de aceptación."
        - label: "La funcionalidad fue implementada y probada."
        - label: "El código fue subido mediante una rama y Pull Request."
        - label: "La funcionalidad quedó integrada correctamente."
        - label: "La documentación fue actualizada cuando aplica."
        - label: "La Historia de Usuario puede cerrarse y moverse a Done."
