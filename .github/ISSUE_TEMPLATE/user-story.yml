name: "Historia de Usuario"
description: "Crear una Historia de Usuario para SignIA"
title: "[HU] "
labels:
  - "Historia de Usuario"

body:

  - type: markdown
    attributes:
      value: |
        ## Historia de Usuario

        Complete la siguiente información de forma clara y concreta.

  - type: input
    id: como
    attributes:
      label: "Como"
      description: "Indique el tipo de usuario o actor."
      placeholder: "Ejemplo: usuario registrado"
    validations:
      required: true

  - type: textarea
    id: quiero
    attributes:
      label: "Quiero"
      description: "Describa la funcionalidad o necesidad."
      placeholder: "Ejemplo: iniciar sesión utilizando mi correo y contraseña"
    validations:
      required: true

  - type: textarea
    id: para
    attributes:
      label: "Para"
      description: "Explique el beneficio o propósito de la funcionalidad."
      placeholder: "Ejemplo: acceder a las funciones asociadas a mi cuenta"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Criterios de Aceptación

        Escriba condiciones claras que permitan comprobar cuándo la Historia de Usuario funciona correctamente.

  - type: textarea
    id: criterios
    attributes:
      label: "Criterios de Aceptación"
      description: "Escriba cada criterio utilizando una casilla."
      value: |
        - [ ] 
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## INVEST

        Verifique que la Historia de Usuario cumpla los criterios INVEST antes de incorporarla a un Sprint.

  - type: checkboxes
    id: invest
    attributes:
      label: "Validación INVEST"
      options:
        - label: "I - Independent: puede desarrollarse sin depender completamente de otra historia."
        - label: "N - Negotiable: sus detalles pueden discutirse y ajustarse con el equipo."
        - label: "V - Valuable: entrega valor al usuario o al funcionamiento del sistema."
        - label: "E - Estimable: el equipo puede estimar el esfuerzo necesario."
        - label: "S - Small: puede completarse dentro de un Sprint."
        - label: "T - Testable: puede comprobarse mediante criterios de aceptación."

  - type: markdown
    attributes:
      value: |
        ## Definition of Done - DoD

        La Historia de Usuario podrá considerarse terminada cuando se cumplan los siguientes puntos.

  - type: checkboxes
    id: dod
    attributes:
      label: "Definition of Done"
      options:
        - label: "Todos los criterios de aceptación fueron cumplidos."
        - label: "La funcionalidad fue implementada."
        - label: "El código fue subido al repositorio."
        - label: "Se utilizó una rama correspondiente a la tarea o Historia de Usuario."
        - label: "Se realizó el Pull Request correspondiente."
        - label: "El código fue revisado cuando aplica."
        - label: "Se realizaron las pruebas necesarias."
        - label: "No existen errores conocidos que impidan utilizar la funcionalidad."
        - label: "La funcionalidad está integrada con los componentes necesarios."
        - label: "La documentación relacionada fue actualizada cuando aplica."
        - label: "El Issue puede cerrarse."
        - label: "La Historia de Usuario puede moverse a Done en GitHub Projects."

  - type: dropdown
    id: prioridad
    attributes:
      label: "Prioridad"
      description: "Seleccione la prioridad de la Historia de Usuario."
      options:
        - Alta
        - Media
        - Baja
    validations:
      required: true

  - type: dropdown
    id: tamano
    attributes:
      label: "Tamaño"
      description: "Seleccione la estimación inicial de la Historia de Usuario."
      options:
        - XS
        - M
        - L
    validations:
      required: true

  - type: input
    id: milestone
    attributes:
      label: "Milestone"
      description: "Indique el Milestone relacionado."
      placeholder: "Ejemplo: M1 - Base Multiusuario de SignIA"

  - type: input
    id: sprint
    attributes:
      label: "Sprint"
      description: "Indique el Sprint en el que se espera trabajar esta Historia de Usuario."
      placeholder: "Ejemplo: Sprint 3"

  - type: textarea
    id: dependencias
    attributes:
      label: "Dependencias"
      description: "Indique si esta Historia de Usuario depende de otra tarea, módulo o Historia de Usuario."
      placeholder: "Ejemplo: requiere que la conexión con PostgreSQL esté configurada."

  - type: textarea
    id: notas
    attributes:
      label: "Notas adicionales"
      description: "Información adicional necesaria para entender o desarrollar la Historia de Usuario."
      placeholder: "Opcional"
