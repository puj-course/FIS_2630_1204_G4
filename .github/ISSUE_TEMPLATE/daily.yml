name: "Daily Scrum"
description: "Registrar el seguimiento diario del Sprint"
title: "[Daily] "
labels:
  - "Daily"

body:
  - type: input
    id: fecha
    attributes:
      label: "Fecha"
      description: "Indique la fecha de la Daily."
      placeholder: "Ejemplo: 22/08/2026"
    validations:
      required: true

  - type: input
    id: sprint
    attributes:
      label: "Sprint"
      description: "Indique el Sprint actual."
      placeholder: "Ejemplo: Sprint 2"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Preguntas de la Daily

        Cada integrante debe responder en los comentarios:

        1. ¿Qué hice ayer?
        2. ¿Qué hice hoy?
        3. ¿Bloqueos?
