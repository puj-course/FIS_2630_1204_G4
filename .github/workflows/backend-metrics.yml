name: Backend Code Metrics

on:
  push:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-metrics:
    name: Metricas del backend Python
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Radon
        run: python -m pip install radon==6.0.1

      - name: Medir complejidad, mantenibilidad y lineas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/metricas
          radon cc app conf -s -a > reports/metricas/complejidad.txt
          radon mi app conf -s > reports/metricas/mantenibilidad.txt
          radon raw app conf -s > reports/metricas/lineas.txt

      - name: Medir acoplamiento entre modulos
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > reports/metricas/acoplamiento.txt
          import ast
          from collections import defaultdict
          from pathlib import Path

          # Solo importaciones explicitas entre archivos de app/ y conf/.
          archivos = sorted(
              ruta for carpeta in ("app", "conf")
              for ruta in Path(carpeta).rglob("*.py")
          )

          def nombre_modulo(ruta):
              partes = ruta.with_suffix("").parts
              if partes[-1] == "__init__":
                  partes = partes[:-1]
              return ".".join(partes)

          modulos = {nombre_modulo(ruta): ruta for ruta in archivos}
          dependencias = {}

          for modulo, ruta in modulos.items():
              arbol = ast.parse(ruta.read_text(encoding="utf-8"), filename=str(ruta))
              encontrados = set()

              for nodo in ast.walk(arbol):
                  if isinstance(nodo, ast.Import):
                      candidatos = [alias.name for alias in nodo.names]
                      destinos = [nombre for nombre in candidatos if nombre in modulos]
                  elif isinstance(nodo, ast.ImportFrom):
                      base = nodo.module or ""
                      if nodo.level:
                          paquete = modulo if ruta.name == "__init__.py" else modulo.rpartition(".")[0]
                          partes = paquete.split(".")
                          if nodo.level > len(partes):
                              continue
                          prefijo = ".".join(partes[:len(partes) - nodo.level + 1])
                          base = ".".join(parte for parte in (prefijo, base) if parte)

                      destinos = []
                      for alias in nodo.names:
                          candidato = ".".join(parte for parte in (base, alias.name) if parte)
                          if candidato in modulos:
                              destinos.append(candidato)
                          elif base in modulos:
                              destinos.append(base)
                  else:
                      continue

                  encontrados.update(destino for destino in destinos if destino != modulo)

              dependencias[modulo] = encontrados

          importado_por = defaultdict(set)
          for modulo, destinos in dependencias.items():
              for destino in destinos:
                  importado_por[destino].add(modulo)

          relaciones = sum(len(destinos) for destinos in dependencias.values())
          print("ACOPLAMIENTO ENTRE MODULOS PYTHON (app/ y conf/)")
          print("Ce: cantidad de otros modulos internos importados por el modulo.")
          print("Ca: cantidad de otros modulos internos que lo importan.")
          print("Nota: analisis estatico de importaciones explicitas; no incluye imports dinamicos ni librerias externas.")
          print(f"Modulos analizados: {len(modulos)}")
          print(f"Dependencias internas distintas: {relaciones}")
          print(f"Promedio de Ce: {relaciones / len(modulos):.2f}" if modulos else "Sin modulos Python")
          print()
          print("Modulo | Ce (salientes) | Ca (entrantes)")
          for modulo in sorted(modulos, key=lambda nombre: (-len(dependencias[nombre]), nombre)):
              print(f"{modulo} | {len(dependencias[modulo])} | {len(importado_por[modulo])}")
          PY

      - name: Mostrar resultados
        shell: bash
        run: |
          for reporte in complejidad mantenibilidad lineas acoplamiento; do
            echo "===== $reporte ====="
            cat "reports/metricas/$reporte.txt"
          done

      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metricas-backend
          path: reports/metricas/
          if-no-files-found: warn
          retention-days: 30
