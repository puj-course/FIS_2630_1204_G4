
name: SonarQube

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: Analisis de calidad
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: signia_test
          POSTGRES_USER: signia
          POSTGRES_PASSWORD: signia_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signia -d signia_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://signia:signia_ci@localhost:5432/signia_test

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # CONFIGURACION DEL BACKEND

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            libgirepository1.0-dev \
            libgirepository-2.0-dev \
            pkg-config \
            postgresql-client

      - name: Instalar dependencias de Python
        run: pip install -r requirements.txt

      - name: Preparar base de datos de pruebas
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/intentos_reconocimiento.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/agregar_resultado_a_intentos.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/seed.sql

      - name: Generar reporte de cobertura Python
        run: |
          mkdir -p reports
          python -m pytest src/tests \
            --cov=app \
            --cov-fail-under=80 \
            --cov-report=xml:reports/cobertura.xml \
            --cov-report=term

      - name: Comprobar reporte Python
        run: test -s reports/cobertura.xml

      # CONFIGURACION DEL FRONTEND

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/front/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: src/front
        run: npm ci

      - name: Ejecutar pruebas React con cobertura
        working-directory: src/front
        run: npm run test:coverage

      - name: Comprobar reporte de cobertura React
        run: test -s src/front/coverage/lcov.info

      - name: Verificar calidad del frontend
        working-directory: src/front
        run: |
          npm run lint
          npm run build

      # ANALISIS FINAL DE SONARQUBE

      - name: Analizar codigo con SonarQube
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
