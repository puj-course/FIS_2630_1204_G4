name: CD - Publicar y desplegar SignIA

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: cd-signia
  cancel-in-progress: false

env:
  SIGNIA_TAG: ${{ github.ref_name }}
  IMAGEN_BACKEND: ${{ vars.DOCKERHUB_USUARIO }}/signia-backend
  IMAGEN_FRONTEND: ${{ vars.DOCKERHUB_USUARIO }}/signia-frontend

jobs:
  pruebas:
    name: Pruebas del backend
    uses: ./.github/workflows/backend-ci.yml

  publicar:
    name: Construir y publicar imágenes
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar configuración de Docker Hub
        run: |
          if [ -z "${{ vars.DOCKERHUB_USUARIO }}" ]; then
            echo "::error::Falta la variable DOCKERHUB_USUARIO del repositorio"
            exit 1
          fi

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USUARIO }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGEN_BACKEND }}:${{ env.SIGNIA_TAG }}
            ${{ env.IMAGEN_BACKEND }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Construir y publicar imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: ./src/front
          file: ./src/front/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGEN_FRONTEND }}:${{ env.SIGNIA_TAG }}
            ${{ env.IMAGEN_FRONTEND }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Resumen de la publicación
        run: |
          {
            echo "### Imágenes publicadas"
            echo "- \`${IMAGEN_BACKEND}:${SIGNIA_TAG}\`"
            echo "- \`${IMAGEN_FRONTEND}:${SIGNIA_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  desplegar:
    name: Desplegar con Docker Compose en WSL
    needs: publicar
    runs-on: [self-hosted, linux, signia-wsl]
    timeout-minutes: 20

    env:
      COMPOSE_PROJECT_NAME: fis_2630_1204_g4
      SIGNIA_IMAGEN_BACKEND: ${{ vars.DOCKERHUB_USUARIO }}/signia-backend
      SIGNIA_IMAGEN_FRONTEND: ${{ vars.DOCKERHUB_USUARIO }}/signia-frontend

    steps:
      - name: Descargar la versión publicada
        uses: actions/checkout@v4

      - name: Preparar el archivo de entorno del despliegue
        run: |
          set -euo pipefail

          ARCHIVO_ENTORNO="$HOME/signia-deploy/.env"

          if [ ! -f "$ARCHIVO_ENTORNO" ]; then
            echo "::error::No existe ~/signia-deploy/.env en la máquina del runner"
            exit 1
          fi

          cp "$ARCHIVO_ENTORNO" .env
          chmod 600 .env

      - name: Descargar las imágenes de Docker Hub
        run: docker compose pull backend frontend

      - name: Desplegar la nueva versión
        run: |
          docker compose up -d --no-build --remove-orphans \
            --wait --wait-timeout 180

      - name: Verificar el backend
        run: |
          curl --fail --silent --show-error \
            --retry 30 --retry-delay 3 --retry-all-errors \
            http://localhost:8000/health

      - name: Verificar el frontend
        run: |
          curl --fail --silent --show-error \
            --retry 30 --retry-delay 3 --retry-all-errors \
            http://localhost:5173/ > /dev/null

      - name: Mostrar contenedores y red de Docker Compose
        run: |
          docker compose ps
          echo "Contenedores conectados a signia_red:"
          docker network inspect signia_red \
            --format '{{range .Containers}}{{.Name}} {{.IPv4Address}}{{println}}{{end}}'

      - name: Resumen del despliegue
        run: |
          {
            echo "### Despliegue ${SIGNIA_TAG}"
            echo "- Backend: \`${SIGNIA_IMAGEN_BACKEND}:${SIGNIA_TAG}\` (healthy)"
            echo "- Frontend: \`${SIGNIA_IMAGEN_FRONTEND}:${SIGNIA_TAG}\`"
            echo "- Red: \`signia_red\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Eliminar el archivo de entorno
        if: always()
        run: rm -f .env