
name: Docker Check

on:
  push:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-check:
    name: Validar Docker y contenedores
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Compose
        uses: docker/setup-compose-action@v2

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Preparar variables de prueba
        run: |
          DB_PASSWORD="$(openssl rand -hex 24)"

          echo "POSTGRES_USER=signia_ci" >> "$GITHUB_ENV"
          echo "POSTGRES_PASSWORD=$DB_PASSWORD" >> "$GITHUB_ENV"
          echo "POSTGRES_DB=signia" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://signia_ci:${DB_PASSWORD}@postgres:5432/signia" >> "$GITHUB_ENV"

      - name: Validar Docker Compose
        run: docker compose config --quiet

      - name: Construir imagen del backend
        run: docker compose build backend

      - name: Construir imagen del frontend
        run: docker compose build frontend

      - name: Iniciar contenedores
        run: docker compose up -d --no-build

      - name: Verificar estado de contenedores
        run: docker compose ps

      - name: Comprobar API FastAPI
        run: |
          curl --fail --silent --show-error \
            --retry 15 \
            --retry-delay 3 \
            --retry-connrefused \
            http://localhost:8000/health

      - name: Comprobar frontend
        run: |
          curl --fail --silent --show-error \
            --retry 15 \
            --retry-delay 3 \
            --retry-connrefused \
            http://localhost:5173/ > /dev/null

      - name: Mostrar logs y finalizar
        if: always()
        run: |
          docker compose ps || true
          docker compose logs --tail=100 || true
          docker compose down --remove-orphans || true
