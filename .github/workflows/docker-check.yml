
name: Docker Check

on:
  push:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-check:
    name: Validar Docker y contenedores
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Compose
        uses: docker/setup-compose-action@v2

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Crear archivo de entorno temporal para CI
        shell: bash
        run: |
          set -euo pipefail

          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

          DB_PASSWORD="$(openssl rand -hex 24)"
          APP_SECRET="$(openssl rand -hex 32)"

          {
            printf '\n'
            printf 'POSTGRES_USER=signia_ci\n'
            printf 'POSTGRES_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'POSTGRES_DB=signia\n'
            printf 'DATABASE_URL=postgresql://signia_ci:%s@postgres:5432/signia\n' "$DB_PASSWORD"
            printf 'SECRET_KEY=%s\n' "$APP_SECRET"
            printf 'JWT_SECRET_KEY=%s\n' "$APP_SECRET"
          } >> .env

          chmod 600 .env

      - name: Validar configuración de Docker Compose
        run: docker compose config --quiet

      - name: Construir imagen del backend
        run: docker compose build backend

      - name: Construir imagen del frontend
        run: docker compose build frontend

      - name: Iniciar contenedores
        run: docker compose up -d --no-build

      - name: Verificar estado de los contenedores
        run: docker compose ps

      - name: Verificar respuesta del backend
        run: |
          curl --fail --silent --show-error \
            --retry 30 --retry-delay 3 --retry-connrefused \
            http://localhost:8000/health

      - name: Verificar respuesta del frontend
        run: |
          curl --fail --silent --show-error \
            --retry 30 --retry-delay 3 --retry-connrefused \
            http://localhost:5173/ > /dev/null

      - name: Mostrar registros y limpiar contenedores
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose ps || true
            docker compose logs --tail=100 || true
            docker compose down --remove-orphans || true
          fi
