services:
    postgres:
        image: postgres:16
        environment:
            POSTGRES_USER: signia
            POSTGRES_PASSWORD: signia
            POSTGRES_DB: signia
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U signia"]
            interval: 5s
            timeout: 5s
            retries: 5
    backend:
        build:
            context: .
            dockerfile: Dockerfile
        env_file:
            - .env
        environment:
            DATABASE_URL: postgresql://signia:signia@postgres:5432/signia
        ports:
            - "8000:8000"
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
            interval: 10s
            timeout: 5s
            retries: 5
        
    frontend:
        build: 
            context: ./src/front
            dockerfile: Dockerfile
        ports:
            - "5173:80"
        depends_on:
            backend:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost/"]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    postgres_data: