
services:
    postgres:
        image: postgres:16
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-signia}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura_POSTGRES_PASSWORD_en_.env}
            POSTGRES_DB: ${POSTGRES_DB:-signia}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
            - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-signia} -d ${POSTGRES_DB:-signia}"]
            interval: 5s
            timeout: 5s
            retries: 5

    backend:
        build:
            context: .
            dockerfile: Dockerfile
        env_file:
            - .env
        environment:
            DATABASE_URL: "postgresql://${POSTGRES_USER:-signia}:${POSTGRES_PASSWORD:?Configura_POSTGRES_PASSWORD_en_.env}@postgres:5432/${POSTGRES_DB:-signia}"
        ports:
            - "8000:8000"
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
            interval: 10s
            timeout: 5s
            retries: 5

    frontend:
        build:
            context: ./src/front
            dockerfile: Dockerfile
        ports:
            - "5173:80"
        depends_on:
            backend:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost/"]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
