services:
    postgres:
        image: postgres:16
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-signia}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura_POSTGRES_PASSWORD_en_.env}
            POSTGRES_DB: ${POSTGRES_DB:-signia}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
            - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
            - ./database/migrations/intentos_reconocimiento.sql:/docker-entrypoint-initdb.d/03-intentos.sql
            - ./database/migrations/agregar_resultado_a_intentos.sql:/docker-entrypoint-initdb.d/04-intentos-resultado.sql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-signia} -d ${POSTGRES_DB:-signia}"]
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - signia_red

    backend:
        image: ${SIGNIA_IMAGEN_BACKEND:-signia-backend}:${SIGNIA_TAG:-dev}
        build:
            context: .
            dockerfile: Dockerfile
        env_file:
            - .env
        environment:
            DATABASE_URL: ${DATABASE_URL:?DATABASE_URL no configurada}
        ports:
            - "8000:8000"
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - signia_red

    frontend:
        image: ${SIGNIA_IMAGEN_FRONTEND:-signia-frontend}:${SIGNIA_TAG:-dev}
        build:
            context: ./src/front
            dockerfile: Dockerfile
        ports:
            - "5173:80"
        depends_on:
            backend:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost/"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - signia_red

networks:
    signia_red:
        name: signia_red
        driver: bridge

volumes:
    postgres_data: